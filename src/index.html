<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Tikona Orbit</title>
<link rel="icon" type="image/png" sizes="16x16" href="../icons/icon16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="../icons/icon32.png" />
<link rel="icon" type="image/png" sizes="128x128" href="../icons/icon128.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
<div id="toast"></div>

<header class="topbar">
  <div class="brand">
    <img class="brand-logo-img" src="../icons/icon.png" alt="Orbit" />
  </div>
  <p class="topbar-quote">Change your orbit. If you don&rsquo;t change your orbit, you&rsquo;ll end up in the same place.<br>&mdash; Dr. APJ Abdul Kalam</p>
  <button id="searchTriggerBtn" class="dashboard-search-trigger" type="button">
    <span class="search-trigger-icon">
      <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </span>
    <span class="search-trigger-text">Search anything...</span>
    <span class="search-trigger-shortcut">⌘K</span>
  </button>
  <div class="topbar-actions">
    <div id="stats" class="stats"></div>
    <div class="view-menu" aria-label="View menu">
      <button class="view-menu-btn" type="button" title="Change view">
        <svg class="view-menu-icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><rect x="1" y="3" width="5" height="14" rx="1.5"/><rect x="7.5" y="3" width="5" height="14" rx="1.5"/><rect x="14" y="3" width="5" height="14" rx="1.5"/></svg>
        <span class="view-menu-label">Horizontal</span>
      </button>
      <div class="view-dropdown" role="menu">
        <button class="view-option" data-view="board" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="1" y="3" width="5" height="14" rx="1.5"/><rect x="7.5" y="3" width="5" height="14" rx="1.5"/><rect x="14" y="3" width="5" height="14" rx="1.5"/></svg>
          <span>Horizontal</span>
        </button>
        <button class="view-option" data-view="table" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="1" y="2" width="18" height="16" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="1" y1="8" x2="19" y2="8" stroke="currentColor" stroke-width="1.6"/><line x1="1" y1="13" x2="19" y2="13" stroke="currentColor" stroke-width="1.6"/></svg>
          <span>Table</span>
        </button>
        <button class="view-option" data-view="stack" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="2" y="2" width="16" height="4.5" rx="1.3"/><rect x="2" y="8" width="16" height="4.5" rx="1.3"/><rect x="2" y="14" width="16" height="4.5" rx="1.3"/></svg>
          <span>Stack</span>
        </button>
        <button class="view-option" data-view="calendar" type="button">
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="1.5" y="3" width="17" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="1.5" y1="7.5" x2="18.5" y2="7.5" stroke="currentColor" stroke-width="1.6"/><line x1="5.5" y1="1.5" x2="5.5" y2="4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><line x1="14.5" y1="1.5" x2="14.5" y2="4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span>Calendar</span>
        </button>
      </div>
    </div>
  </div>
</header>

<div class="dashboard-shell">
  <aside id="appSidebar" class="app-sidebar">
    <div id="sidebarTop" class="app-sidebar-top"></div>
    <div id="sidebarBottom" class="app-sidebar-bottom"></div>
  </aside>
  <div id="sidebarResizeHandle" class="sidebar-resize-handle" title="Drag to resize"></div>
  <main class="dashboard-main">
    <div class="viewbar">
      <button id="sidebarToggleBtn" class="sidebar-toggle-btn" type="button" title="Hide sidebar">
        <svg viewBox="0 0 20 20" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-6 6 6 6"/></svg>
      </button>
      <h1 id="dashboardTitle" class="dashboard-title-compact">All tasks</h1>
      <div id="mainViewActions" class="viewbar-actions">
        <button id="archivedListsBtn" class="tab-add" type="button" title="View archived lists">Archived</button>
        <button id="globalAddTaskBtn" class="tab-add" type="button" title="Add new task or project">+ Add</button>
      </div>
      <div id="kraViewActions" class="viewbar-actions hidden"></div>
      <div id="productivityViewActions" class="viewbar-actions hidden"></div>
    </div>

    <section id="board" class="board"></section>
  </main>
</div>

<template id="tpl-list">
  <section class="list-column" draggable="false">
    <header class="list-header">
      <h2 class="list-name" contenteditable="true" spellcheck="false"></h2>
      <span class="list-count"></span>
      <button class="list-completed-btn hidden" title="Completed tasks">
        <svg viewBox="0 0 20 20" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5l3.5 3.5L16 5.5"/></svg>
        <span class="list-completed-count"></span>
      </button>
      <button class="list-deleted-btn hidden" title="Deleted tasks">
        <svg viewBox="0 0 20 20" width="12" height="12" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1V6M6 6l.5 9a1 1 0 0 0 1 .9h5a1 1 0 0 0 1-.9L14 6"/></svg>
        <span class="list-deleted-count"></span>
      </button>
      <div class="list-menu-wrap">
        <button class="icon-btn list-menu-btn" title="List options">&#8942;</button>
        <div class="list-menu hidden">
          <button data-action="edit-list">Edit</button>
          <button data-action="copy-list">Copy</button>
          <button data-action="archive-list">Archive list</button>
          <button data-action="delete-list" class="danger">Delete list</button>
        </div>
      </div>
    </header>
    <div class="sections"></div>
    <div class="unsectioned tasks-list"></div>
    <div class="completed-wrap hidden">
      <div class="completed-list tasks-list"></div>
    </div>
    <div class="deleted-wrap hidden">
      <div class="deleted-list"></div>
    </div>
  </section>
</template>

<template id="tpl-section">
  <div class="section-block">
    <div class="section-header">
      <button class="section-collapse">&#9662;</button>
      <span class="section-name" contenteditable="true" spellcheck="false"></span>
      <button class="icon-btn section-delete" title="Delete section">&times;</button>
    </div>
    <div class="tasks-list section-tasks"></div>
  </div>
</template>

<template id="tpl-task">
  <div class="task-row">
    <div class="task-check-col">
      <button class="task-check" title="Mark done"></button>
      <div class="task-progress-bar" title="Click to set progress (bottom to top)"></div>
    </div>
    <div class="task-body">
      <div class="task-title-row">
        <span class="task-priority" title="Click to cycle priority"></span>
        <span class="task-text" contenteditable="true" spellcheck="false"></span>
        <button class="icon-btn task-edit" title="Edit task">&#9998;</button>
        <button class="icon-btn task-delete" title="Delete task">&times;</button>
      </div>
      <div class="task-meta">
        <span class="task-created"></span>
        <span class="task-status"></span>
        <span class="task-due"></span>
      </div>
    </div>
  </div>
</template>

<!-- Command Palette Modal -->
<div id="commandPalette" class="command-palette-overlay hidden">
  <div class="command-palette-modal">
    <div class="cp-header">
      <svg class="cp-search-icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="cpInput" type="text" placeholder="Search tasks, projects, employees..." autocomplete="off" />
      <button id="cpCloseBtn" type="button" title="Close (Esc)">&times;</button>
    </div>
    <div id="cpResults" class="cp-results">
      <!-- Dynamic results injected here -->
    </div>
  </div>
</div>

<!-- Mobile Bottom Navigation -->
<nav id="mobileBottomNav" class="mobile-bottom-nav">
  <button class="mobile-nav-btn active" data-action="tasks" title="Tasks">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
    <span>Tasks</span>
  </button>
  <button class="mobile-nav-btn" data-action="tabs" title="Tabs">
    <svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="4"/><circle cx="10" cy="10" r="1" fill="currentColor" stroke="none"/></svg>
    <span>Tabs</span>
  </button>
  <button class="mobile-nav-btn" data-action="log" title="Log">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Log</span>
  </button>
  <button class="mobile-nav-btn" data-action="analytics" title="Analytics">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <span>Analytics</span>
  </button>
  <button class="mobile-nav-btn" data-action="hr" title="HR">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 1 0 3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>HR</span>
  </button>
</nav>
<button id="mobileFabAdd" class="mobile-fab-add" type="button" title="Add task or project">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<script type="module" src="app.js"></script>
</body>
</html>
